global
    log stdout format raw local0
    maxconn 1024
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option dontlognull
    timeout connect 1s
    timeout client 60s
    timeout server 50s
    timeout queue 5s
    timeout check 3s
    retries 2
    option redispatch 1
    default-server inter 1s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s
    accepted_payload_size 8192

listen status
    bind :8404
    http-request return status 200 content-type text/plain string Healthy if { path /health/ready }
    stats enable
    stats uri /stats

frontend public_api
    bind :8080
    bind :8443 ssl crt /run/workload/tls.pem
    # Route no internal endpoint externally, including on the localhost compatibility port.
    http-request deny deny_status 403 if { path_beg /internal/ }
    http-request del-header X-Service-Identity
    http-request del-header X-Client-Cert
    default_backend gateway_pool

backend gateway_pool
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 gateway:8443 ssl verify required ca-file /run/trust/ca.crt crt /run/workload/tls.pem sni str(gateway) verifyhost gateway check port 8080 no-check-ssl resolvers docker init-addr none resolve-prefer ipv4

# End-to-end TLS passthrough preserves the real caller certificate at the destination API.
listen identity_pool
    mode tcp
    bind :8081
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 identity-service:8443 check port 8080 resolvers docker init-addr none resolve-prefer ipv4

listen tutor_pool
    mode tcp
    bind :8082
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 tutor-service:8443 check port 8080 resolvers docker init-addr none resolve-prefer ipv4

listen student_pool
    mode tcp
    bind :8083
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 student-service:8443 check port 8080 resolvers docker init-addr none resolve-prefer ipv4

listen scheduling_pool
    mode tcp
    bind :8084
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-3 scheduling-service:8443 check port 8080 resolvers docker init-addr none resolve-prefer ipv4

listen notification_pool
    mode tcp
    bind :8085
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 notification-service:8443 check port 8080 resolvers docker init-addr none resolve-prefer ipv4
