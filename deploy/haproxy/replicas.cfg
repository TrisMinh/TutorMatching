global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 1s
    timeout client 60s
    timeout server 50s
    timeout queue 5s
    timeout check 3s
    retries 2
    retry-on conn-failure
    option redispatch 1
    default-server inter 1s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s
    accepted_payload_size 8192

listen status
    bind :8404
    http-request return status 200 content-type text/plain string Healthy if { path /health/ready }
    stats enable
    stats uri /stats

frontend public_api
    bind :8080
    default_backend gateway_pool

listen identity_pool
    bind :8081
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 identity-service:8080 check resolvers docker init-addr none resolve-prefer ipv4

listen tutor_pool
    bind :8082
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 tutor-service:8080 check resolvers docker init-addr none resolve-prefer ipv4

listen student_pool
    bind :8083
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 student-service:8080 check resolvers docker init-addr none resolve-prefer ipv4

listen scheduling_pool
    bind :8084
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-3 scheduling-service:8080 check resolvers docker init-addr none resolve-prefer ipv4

listen notification_pool
    bind :8085
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 notification-service:8080 check resolvers docker init-addr none resolve-prefer ipv4

backend gateway_pool
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 1-1 gateway:8080 check resolvers docker init-addr none resolve-prefer ipv4
