map $request_uri $record_access {
    default 1;
    ~^/auth/reset-password 0;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$record_access;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=2s ipv6=off;

    location /api/ {
        set $api http://service-lb:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 55s;
        # Uncertain writes are recovered by application idempotency, not proxy replay.
        proxy_next_upstream off;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
