server {
    listen 80;
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /run/workload/tls.crt;
    ssl_certificate_key /run/workload/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=2s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        set $api https://service-lb:8443;
        proxy_pass $api$request_uri;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/trust/ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name service-lb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 55s;
        proxy_next_upstream off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
