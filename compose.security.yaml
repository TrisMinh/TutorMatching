# Always layer after compose.yaml and compose.ha.yaml; runtime credentials are generated, ignored files.
x-workload: &workload
  environment:
    SECURITY_CONFIG_PATH: /run/workload/runtime.json

services:
  identity-service:
    <<: *workload
    volumes:
      - ./.security/identity:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  tutor-service:
    <<: *workload
    volumes:
      - ./.security/tutor:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  student-service:
    <<: *workload
    volumes:
      - ./.security/student:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  scheduling-service:
    <<: *workload
    volumes:
      - ./.security/scheduling:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  notification-service:
    <<: *workload
    volumes:
      - ./.security/notification:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  gateway:
    <<: *workload
    networks: [backend, data]
    volumes:
      - ./.security/gateway:/run/workload:ro
      - ./.security/public:/run/trust:ro
      - security-audit:/var/log/tutormatching
  service-lb:
    ports: !override
      - '127.0.0.1:8080:8080' # Explicit localhost-only development compatibility.
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:8404:8404'
    volumes: !override
      - ./deploy/haproxy/security.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./.security/service-lb:/run/workload:ro
      - ./.security/public:/run/trust:ro
  redis:
    command: [redis-server, /run/redis/redis.conf]
    volumes:
      - ./.security/redis:/run/redis:ro
      - ./.security/public:/run/trust:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/redis/health.pass) redis-cli --tls --cacert /run/trust/ca.crt -p 6380 --user health ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    volumes:
      - ./.security/rabbitmq:/run/broker:ro
      - ./.security/public:/run/trust:ro
      - ./.security/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  web:
    ports: !override
      - '127.0.0.1:3000:80' # Local HTTP demo only; use HTTPS 3443 for security verification.
      - '127.0.0.1:3443:443'
    volumes: !override
      - ./deploy/nginx/security.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.security/web:/run/workload:ro
      - ./.security/public:/run/trust:ro

volumes:
  security-audit: {}
