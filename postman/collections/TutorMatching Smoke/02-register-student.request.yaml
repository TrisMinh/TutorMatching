$kind: http-request
name: Register student
order: 2000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"email":"student-{{runId}}@example.test","password":"{{password}}","role":"Student","fullName":"Smoke Student"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('student registered', () => pm.response.to.have.status(201));
