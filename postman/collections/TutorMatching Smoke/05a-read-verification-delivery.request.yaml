$kind: http-request
name: Read tutor verification delivery
order: 5100
url: '{{mailpitBaseUrl}}/api/v1/search?query=to%3Atutor-{{runId}}@example.test'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('verification email delivered to Mailpit', () => pm.response.to.have.status(200));
      const message = pm.response.json().messages.find(m => m.Subject === 'Verify your TutorMatching email');
      pm.expect(message).to.exist;
      pm.collectionVariables.set('tutorVerificationMessageId', message.ID);
