$kind: http-request
name: Upsert student profile
order: 4000
url: '{{baseUrl}}/api/v1/students/me'
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"displayName":"Smoke Student","educationLevel":3,"learningGoal":"Validate the full booking flow","timezone":"Asia/Ho_Chi_Minh"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('student profile saved', () => pm.response.to.have.status(200));
