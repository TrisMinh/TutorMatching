$kind: http-request
name: Confirm booking
order: 13000
url: '{{baseUrl}}/api/v1/bookings'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"holdId":"{{holdId}}","holdToken":"{{holdToken}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('booking confirmed', () => pm.response.to.have.status(201));
      pm.expect(pm.response.json().status).to.equal('Confirmed');
