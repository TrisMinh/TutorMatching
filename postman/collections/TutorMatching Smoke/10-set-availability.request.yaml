$kind: http-request
name: Set tutor availability
order: 10000
url: '{{baseUrl}}/api/v1/tutors/me/availability'
method: PUT
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tutorToken}}'
body:
  type: json
  content: |-
    [{"startAtUtc":"{{availabilityStart}}","endAtUtc":"{{availabilityEnd}}"}]
scripts:
  - type: afterResponse
    code: |-
      pm.test('availability saved', () => pm.response.to.have.status(204));
