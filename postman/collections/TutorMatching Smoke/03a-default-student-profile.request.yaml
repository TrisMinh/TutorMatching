$kind: http-request
name: Default student profile from registration
order: 3900
url: '{{baseUrl}}/api/v1/students/me'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('registration name is enough; learning details are optional', () => {
        pm.response.to.have.status(200);
        const profile = pm.response.json();
        pm.expect(profile.displayName).to.eql('Smoke Student');
        pm.expect(profile.educationLevel).to.eql(-1);
        pm.expect(profile.learningGoal).to.eql('');
        pm.expect(profile.interests).to.eql([]);
      });
