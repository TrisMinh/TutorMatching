$kind: http-request
name: List notifications
order: 14000
url: '{{baseUrl}}/api/v1/notifications?page=1&pageSize=20'
method: GET
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
scripts:
  - type: afterResponse
    code: |-
      pm.test('notifications endpoint responds', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json()).to.have.property('items');
