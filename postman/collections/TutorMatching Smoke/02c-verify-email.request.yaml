$kind: http-request
name: Verify student email
order: 2300
url: '{{baseUrl}}/api/v1/auth/verify-email'
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"email":"student-{{runId}}@example.test","code":"{{studentVerificationCode}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('email verified before login', () => pm.response.to.have.status(200));
