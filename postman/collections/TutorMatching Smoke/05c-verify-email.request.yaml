$kind: http-request
name: Verify tutor email
order: 5300
url: '{{baseUrl}}/api/v1/auth/verify-email'
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"email":"tutor-{{runId}}@example.test","code":"{{tutorVerificationCode}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('email verified before login', () => pm.response.to.have.status(200));
