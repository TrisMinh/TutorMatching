$kind: http-request
name: Login tutor
order: 2000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email": "tutor16@demo.tutormatching.test", "password": "{{password}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login tutor', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('tutorToken', pm.response.json().accessToken);
