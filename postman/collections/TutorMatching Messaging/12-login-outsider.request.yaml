$kind: http-request
name: Login outsider
order: 12000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email": "student20@demo.tutormatching.test", "password": "{{password}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login outsider', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('strangerToken', pm.response.json().accessToken);
