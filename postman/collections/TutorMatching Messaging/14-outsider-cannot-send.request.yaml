$kind: http-request
name: Outsider cannot send
order: 14000
url: '{{baseUrl}}/api/v1/conversations/{{conversationId}}/messages'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{strangerToken}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"body": "Hello tutor {{runId}}", "clientMessageId": "{{clientMessageId}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Outsider cannot send', () => pm.response.to.have.status(404));
