$kind: http-request
name: Student sends message
order: 5000
url: '{{baseUrl}}/api/v1/conversations/{{conversationId}}/messages'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{studentToken}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"body": "Hello tutor {{runId}}", "clientMessageId": "{{clientMessageId}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Student sends message', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('messageId', pm.response.json().id);
